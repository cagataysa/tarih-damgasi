<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarih Damgası</title>
<meta name="description" content="Fotoğrafa tarih, saat, proje, not ve GPS koordinatı basar.">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Damga">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Kamera uygulaması düzeni: üst şerit (GPS, ayarlar), ortada vizör, altta deklanşör. Tek, koyu tema. */
:root{
  --bg:#0e1013; --panel:#191c21; --panel-2:#22262c; --line:#2f343b;
  --fg:#eef1f4; --muted:#98a1ab; --accent:#ff9a3c; --accent-ink:#1d1104;
  --ok:#5cc98a; --warn:#f2c14e; --err:#ff6b5e;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.top-l{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.proj-pill{display:flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;font:700 17px var(--sans);max-width:72vw;min-width:0}
.proj-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-pill svg{width:16px;height:16px;flex:none;color:var(--muted)}
.proj-pill.empty{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);min-width:0;max-width:72vw}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.chip[data-s="ok"] .dot{background:var(--ok)} .chip[data-s="wait"] .dot{background:var(--warn);animation:blink 1s infinite}
.chip[data-s="err"] .dot{background:var(--err)}
@keyframes blink{50%{opacity:.3}}
.icon{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);flex:none}
.icon svg{width:20px;height:20px}

.stage{position:relative;min-height:0;background:#000;overflow:hidden}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage video{object-fit:contain}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.cam-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:var(--muted)}
.cam-msg p{margin:0;max-width:32ch}

.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:16px max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(24px,env(safe-area-inset-left,0px))}
.bottom .round:first-child{justify-self:start} .bottom .round:last-child{justify-self:end}
.round{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
.round svg{width:22px;height:22px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--fg);background:transparent;padding:5px}
.shutter::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:var(--fg);transition:transform .1s}
.shutter:active::after{transform:scale(.88)}
.shutter:disabled{opacity:.35}

.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:13px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* İnceleme ekranı */
.review{position:fixed;inset:0;background:var(--bg);display:grid;grid-template-rows:1fr auto;z-index:5}
.review .pic{min-height:0;position:relative;background:#000;margin-top:env(safe-area-inset-top,0px)}
.review img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;-webkit-touch-callout:default}
.review-bar{display:grid;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
.review-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:500}
#msg{margin:0;font-size:13px;min-height:1.2em;text-align:center}
#msg.ok{color:var(--ok)} #msg.err{color:var(--err)}

/* Ayarlar paneli */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  max-height:88dvh;overflow:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px,env(safe-area-inset-left,0px))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet h2{font-size:18px;margin:0}
.form{display:grid;gap:16px;max-width:560px;margin:0 auto}
.field{display:grid;gap:6px;min-width:0}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.field input[type=text],.field input[type=datetime-local]{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:8px 4px;border-radius:7px;font-size:14px;color:var(--muted);cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--panel-2);color:var(--fg);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)} .switch input:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0}
.projlist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--muted)}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pchip.add{border-style:dashed}
.projedit{display:grid;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.projedit .field input[type=text]{background:var(--panel)}
.logo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo-box{width:96px;height:56px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:12px;color:#6b7480;flex:none}
.logo-box img{max-width:88px;max-height:48px;object-fit:contain}
.btn.small{padding:9px 12px;font-size:14px}
.btn.danger{color:var(--err);background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <div class="top-l">
      <button class="proj-pill" id="projPill" type="button" aria-label="Proje seç"><span id="projPillTxt">Proje seç</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="chip" id="gpsChip" data-s="off"><i class="dot"></i><span id="gpsTxt">GPS kapalı</span></span>
    </div>
    <button class="icon" id="settingsBtn" type="button" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <section class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="flash" id="flash"></div>
    <div class="cam-msg" id="camMsg" hidden>
      <p id="camMsgTxt">Kamera açılıyor…</p>
      <button class="btn primary" id="retryCam" type="button">Kamerayı aç</button>
    </div>
  </section>

  <footer class="bottom">
    <label class="round" for="pick" aria-label="Galeriden fotoğraf seç">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg>
    </label>
    <input class="sr" type="file" id="pick" accept="image/*">
    <button class="shutter" id="shutter" type="button" aria-label="Fotoğraf çek" disabled></button>
    <button class="round" id="flip" type="button" aria-label="Ön/arka kamera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-14 5.3M4 12A8 8 0 0 1 18 6.7"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>
    </button>
  </footer>
</main>

<section class="review" id="review" hidden>
  <div class="pic"><img id="shot" alt="Damgalı fotoğraf"></div>
  <div class="review-bar">
    <label class="field"><span class="lbl">Tarih ve saat</span><input type="datetime-local" id="shotDate" step="1"></label>
    <div class="meta" id="meta"></div>
    <div class="review-row">
      <button class="btn" id="again" type="button">Vazgeç</button>
      <button class="btn primary" id="save" type="button">Kaydet</button>
    </div>
    <p id="msg" aria-live="polite"></p>
  </div>
</section>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden aria-label="Ayarlar">
  <div class="grab"></div>
  <div class="form">
    <div class="sheet-head"><h2>Damga ayarları</h2><button class="btn" id="closeSheet" type="button">Tamam</button></div>
    <div class="field"><span class="lbl">Proje</span><div class="projlist" id="projList"></div></div>
    <div class="projedit" id="projEdit" hidden>
      <label class="field"><span class="lbl">Kısa ad (damgada görünür)</span><input type="text" id="pKod" maxlength="40" autocomplete="off"></label>
      <label class="field"><span class="lbl">İşin tam adı</span><input type="text" id="pAd" maxlength="120" autocomplete="off" placeholder="İsteğe bağlı"></label>
      <div class="field"><span class="lbl">Logo</span>
        <div class="logo-row">
          <div class="logo-box" id="logoBox">Logo yok</div>
          <label class="btn small" for="logoPick">Logo yükle</label>
          <input class="sr" type="file" id="logoPick" accept="image/png,image/jpeg,image/webp,image/svg+xml">
          <button class="btn small" id="logoDel" type="button">Kaldır</button>
        </div>
        <span class="hint">Şeffaf arka planlı PNG en iyi sonucu verir. Logo damganın üstünde beyaz zeminde görünür.</span>
      </div>
      <button class="btn small danger" id="pDel" type="button">Projeyi sil</button>
    </div>
    <label class="switch"><span><b>İşin tam adını yaz</b><br><span class="hint">Kısa adın altına ayrı satır olarak</span></span><input type="checkbox" id="tamAd"></label>
    <label class="field"><span class="lbl">Not</span><input type="text" id="not" placeholder="ör. Km 2+450 boru döşeme" maxlength="80" autocomplete="off"></label>
    <label class="switch"><span><b>GPS koordinatı</b><br><span class="hint">Enlem ve boylamı damgaya ekler</span></span><input type="checkbox" id="gps" checked></label>
    <div class="two">
      <div class="field"><span class="lbl">Stil</span>
        <div class="seg"><label><input type="radio" name="stil" id="stil-serit" value="serit" checked>Şerit</label><label><input type="radio" name="stil" id="stil-retro" value="retro">Retro</label></div>
      </div>
      <div class="field"><span class="lbl">Tarih köşesi</span>
        <div class="seg"><label><input type="radio" name="konum" id="konum-sol" value="sol">Sol</label><label><input type="radio" name="konum" id="konum-sag" value="sag" checked>Sağ</label></div>
      </div>
    </div>
    <label class="field"><span class="lbl">Yazı boyutu</span><input type="range" id="boyut" min="0.6" max="1.8" step="0.1" value="1"></label>
    <p class="hint">Ayarlar bu telefonda saklanır. Kaydet, paylaşım menüsünü açar: “Görüntüyü Kaydet”i seç.</p>
  </div>
</section>

<script>
(() => {
const $ = id => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), stage = $('stage');
const p2 = n => String(n).padStart(2, '0');
const fmtDate = d => `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}  ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const toLocal = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const fmtGps = g => `${Math.abs(g.lat).toFixed(5)}° ${g.lat>=0?'K':'G'}  ${Math.abs(g.lon).toFixed(5)}° ${g.lon>=0?'D':'B'}${g.acc?`  ±${Math.round(g.acc)} m`:''}`;

/* ---------- Ayarlar ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
const DEFAULT_PROJECTS = [
  { id:'w2', kod:'Adana-TERRP-W2', ad:'Pozantı Atıksu Arıtma Tesisi İnşaatı' },
  { id:'w3', kod:'Adana-TERRP-W3', ad:'Pozantı-Akçatekir Kanalizasyon ve İçme Suyu Şebekesi Yapım İşi' },
  { id:'w4', kod:'Adana-TERRP-W4', ad:'Adana Merkez Yağmur Suyu Yapım İşi' }
];
const S = { not:'', gps:true, stil:'serit', konum:'sag', boyut:1, tamAd:false, projects:null, active:null };
try { Object.assign(S, JSON.parse(localStorage.getItem('damga') || '{}')); } catch(e) {}
if (!Array.isArray(S.projects)){
  S.projects = DEFAULT_PROJECTS.map(p => ({ ...p }));
  const old = (S.proje || '').trim();          // önceki sürümden kalan serbest proje adı
  if (old){ let p = S.projects.find(q => q.kod === old); if (!p){ p = { id: uid(), kod: old, ad: '' }; S.projects.push(p); } S.active = p.id; }
}
delete S.proje;
const save = () => {
  try { localStorage.setItem('damga', JSON.stringify(S)); return true; }
  catch(e) { return false; }
};
const active = () => S.projects.find(p => p.id === S.active) || null;
$('not').value = S.not; $('gps').checked = S.gps; $('boyut').value = S.boyut; $('tamAd').checked = S.tamAd;
$('stil-' + S.stil).checked = true; $('konum-' + S.konum).checked = true;
$('not').addEventListener('input', () => { S.not = $('not').value; save(); drawOverlay(); });
$('tamAd').addEventListener('change', () => { S.tamAd = $('tamAd').checked; save(); drawOverlay(); });

/* ---------- Projeler ---------- */
const logoImgs = {};
function logoFor(p){
  if (!p || !p.logo) return null;
  let im = logoImgs[p.id];
  if (!im || im._src !== p.logo){ im = new Image(); im._src = p.logo; im.onload = drawOverlay; im.src = p.logo; logoImgs[p.id] = im; }
  return im.complete && im.naturalWidth ? im : null;
}
function renderPill(){
  const p = active();
  $('projPillTxt').textContent = p ? (p.kod || 'Adsız proje') : 'Proje seç';
  $('projPill').classList.toggle('empty', !p);
}
function renderChips(){
  const L = $('projList'); L.textContent = '';
  const mk = (id, label, cls) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pchip' + (cls ? ' ' + cls : '');
    b.textContent = label;
    if (cls !== 'add'){ b.setAttribute('aria-pressed', String(S.active === id));
      b.onclick = () => { S.active = id; save(); renderProjects(); drawOverlay(); }; }
    L.appendChild(b); return b;
  };
  mk(null, 'Yok');
  S.projects.forEach(p => mk(p.id, p.kod || 'Adsız proje'));
  mk(null, '+ Yeni proje', 'add').onclick = () => {
    const p = { id: uid(), kod: '', ad: '' }; S.projects.push(p); S.active = p.id; save();
    renderProjects(); drawOverlay(); $('pKod').focus();
  };
  renderPill();
}
let delArmed = null;
function renderEdit(){
  const p = active(); $('projEdit').hidden = !p; if (!p) return;
  $('pKod').value = p.kod; $('pKod').placeholder = 'ör. Adana-TERRP-W3'; $('pAd').value = p.ad || '';
  const box = $('logoBox'); box.textContent = '';
  if (p.logo){ const im = document.createElement('img'); im.src = p.logo; im.alt = 'Proje logosu'; box.appendChild(im); }
  else box.textContent = 'Logo yok';
  $('logoDel').hidden = !p.logo;
  clearTimeout(delArmed); delArmed = null; $('pDel').textContent = 'Projeyi sil';
}
function renderProjects(){ renderChips(); renderEdit(); }
$('pKod').addEventListener('input', () => { const p = active(); if (!p) return; p.kod = $('pKod').value; save(); renderChips(); drawOverlay(); });
$('pAd').addEventListener('input', () => { const p = active(); if (!p) return; p.ad = $('pAd').value; save(); drawOverlay(); });
$('logoPick').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; const p = active(); if (!f || !p) return;
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 480 / Math.max(img.naturalWidth || 480, img.naturalHeight || 480));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round((img.naturalWidth || 480) * k)); c.height = Math.max(1, Math.round((img.naturalHeight || 240) * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const prev = p.logo; p.logo = c.toDataURL('image/png');
    if (!save()){ p.logo = prev; $('logoBox').textContent = 'Kaydedilemedi'; return; }
    renderEdit(); drawOverlay();
  };
  img.onerror = () => { $('logoBox').textContent = 'Açılamadı'; };
  img.src = URL.createObjectURL(f);
});
$('logoDel').onclick = () => { const p = active(); if (!p) return; delete p.logo; save(); renderEdit(); drawOverlay(); };
$('pDel').onclick = () => {
  const p = active(); if (!p) return;
  if (!delArmed){ $('pDel').textContent = 'Emin misin? Tekrar dokun'; delArmed = setTimeout(() => { delArmed = null; $('pDel').textContent = 'Projeyi sil'; }, 3000); return; }
  S.projects = S.projects.filter(q => q.id !== p.id); S.active = null; save(); renderProjects(); drawOverlay();
};
$('projPill').onclick = () => openSheet(true);
renderProjects();
$('boyut').addEventListener('input', () => { S.boyut = parseFloat($('boyut').value); save(); drawOverlay(); });
document.querySelectorAll('[name=stil],[name=konum]').forEach(r => r.addEventListener('change', () => {
  S[r.name] = r.value; save(); drawOverlay(); }));
$('gps').addEventListener('change', () => { S.gps = $('gps').checked; save(); S.gps ? startGps() : stopGps(); drawOverlay(); });

const openSheet = o => { $('sheet').hidden = !o; $('sheetBg').hidden = !o; };
$('settingsBtn').onclick = () => openSheet(true);
$('closeSheet').onclick = $('sheetBg').onclick = () => openSheet(false);

/* ---------- Damga çizimi ---------- */
function roundRect(x, X, Y, W, H, r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
const SANS = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
function wrapText(x, text, maxW){
  const out = []; let cur = '';
  for (const w of text.split(/\s+/)){ const t = cur ? cur + ' ' + w : w;
    if (cur && x.measureText(t).width > maxW){ out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); return out;
}
// İki blok: tarih bloğu seçilen köşede, proje bloğu karşı köşede (daha büyük yazı)
function stampBlocks(date, gps){
  const p = active(), info = [{ t: fmtDate(date), f: 30, b: 700 }], proj = [];
  if (S.not.trim()) info.push({ t: S.not.trim(), f: 20, b: 500 });
  if (S.gps && gps) info.push({ t: fmtGps(gps), f: 20, b: 500 });
  if (p){
    if (p.kod.trim()) proj.push({ t: p.kod.trim(), f: 34, b: 700 });
    if (S.tamAd && p.ad && p.ad.trim()) proj.push({ t: p.ad.trim(), f: 25, b: 600, wrap: true });
  }
  return { info, proj, p };
}
function drawStamp(x, ox, oy, W, H, date, gps){
  const { info, proj, p } = stampBlocks(date, gps);
  const retro = S.stil === 'retro';
  const s = Math.max(W, H) / 1000 * S.boyut, m = 22*s, pad = retro ? 0 : 14*s, LH = 1.3;
  const fam = retro ? getComputedStyle(document.documentElement).getPropertyValue('--mono') : SANS;
  const font = l => `${l.b} ${l.f*s}px ${fam}`;
  const layout = (lines, maxW) => {
    const rows = []; let w = 0;
    for (const l of lines){ x.font = font(l);
      for (const t of (l.wrap ? wrapText(x, l.t, maxW - 2*pad) : [l.t])){
        w = Math.max(w, Math.min(x.measureText(t).width, maxW - 2*pad)); rows.push({ t, l }); } }
    const h = rows.reduce((a, r, i) => a + r.l.f*s*(i === rows.length-1 ? 1 : LH), 0);
    return { rows, w: w + 2*pad, h: h + 2*pad };
  };
  const draw = (B, side, bottom) => {
    const right = side === 'sag', bx = right ? ox+W-m-B.w : ox+m, by = bottom - B.h;
    x.save();
    if (!retro){
      x.fillStyle = 'rgba(12,14,17,.62)'; roundRect(x, bx, by, B.w, B.h, 10*s); x.fill();
      x.fillStyle = '#ff9a3c'; x.fillRect(bx, by+pad*.7, Math.max(2, 4*s), B.h-pad*1.4);
    } else { x.shadowColor = 'rgba(0,0,0,.65)'; x.shadowBlur = 6*s; }
    x.textBaseline = 'top'; x.textAlign = retro && right ? 'right' : 'left';
    let y = by + pad;
    B.rows.forEach(r => {
      x.font = font(r.l);
      x.fillStyle = retro ? '#ff8a1f' : (r.l.b === 700 ? '#fff' : 'rgba(255,255,255,.92)');
      x.fillText(r.t, retro ? (right ? bx+B.w : bx) : bx+pad, y, B.w - 2*pad);
      y += r.l.f*s*LH;
    });
    x.restore();
    return { x: bx, y: by, w: B.w, right };
  };
  const dSide = S.konum === 'sag' ? 'sag' : 'sol', pSide = dSide === 'sag' ? 'sol' : 'sag', full = W - 2*m;
  const D = layout(info, full), dBox = draw(D, dSide, oy+H-m);
  let pBox = null;
  if (proj.length){
    let avail = W - 3*m - D.w, bottom = oy+H-m;
    if (avail < 0.3*W){ avail = full; bottom = dBox.y - 10*s; }   // yer yoksa tarih bloğunun üstüne çıkar
    pBox = draw(layout(proj, avail), pSide, bottom);
  }
  // Logo: proje bloğunun (yoksa tarih bloğunun) üstünde, beyaz zeminde
  const logo = logoFor(p);
  if (logo){
    const t = pBox || dBox, pp = 7*s;
    let lh = 54*s, lw = lh * logo.naturalWidth / logo.naturalHeight;
    const lim = Math.min(Math.max(t.w, 180*s), 260*s, full) - 2*pp; if (lw > lim){ lh *= lim / lw; lw = lim; }
    const pw = lw + 2*pp, ph = lh + 2*pp, px = t.right ? t.x + t.w - pw : t.x, py = t.y - 8*s - ph;
    x.save(); x.shadowColor = 'rgba(0,0,0,.25)'; x.shadowBlur = 6*s;
    x.fillStyle = 'rgba(255,255,255,.94)'; roundRect(x, px, py, pw, ph, 8*s); x.fill(); x.restore();
    x.drawImage(logo, px+pp, py+pp, lw, lh);
  }
}

/* ---------- GPS ---------- */
let gps = null, gpsWatch = null;
function setChip(state, text){ $('gpsChip').dataset.s = state; $('gpsTxt').textContent = text; }
function startGps(){
  if (!('geolocation' in navigator)){ setChip('err', 'GPS yok'); return; }
  if (gpsWatch != null) return;
  setChip('wait', 'Konum aranıyor…');
  gpsWatch = navigator.geolocation.watchPosition(p => {
    gps = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
    setChip('ok', fmtGps(gps)); drawOverlay();
  }, err => {
    setChip('err', err.code === 1 ? 'Konum izni yok' : 'Konum alınamadı');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
}
function stopGps(){ if (gpsWatch != null) navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; gps = null; setChip('off', 'GPS kapalı'); }

/* ---------- Kamera ---------- */
let stream = null, facing = 'environment';
function contentRect(){
  const r = stage.getBoundingClientRect(), vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const k = Math.min(r.width / vw, r.height / vh), w = vw*k, h = vh*k;
  return { x: (r.width-w)/2, y: (r.height-h)/2, w, h, W: r.width, H: r.height };
}
function drawOverlay(){
  const c = contentRect(), dpr = window.devicePixelRatio || 1, x = overlay.getContext('2d');
  const r = stage.getBoundingClientRect();
  if (overlay.width !== Math.round(r.width*dpr) || overlay.height !== Math.round(r.height*dpr)){
    overlay.width = Math.round(r.width*dpr); overlay.height = Math.round(r.height*dpr);
  }
  x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, r.width, r.height);
  if (!c || !stream) return;
  drawStamp(x, c.x, c.y, c.w, c.h, new Date(), gps);
}
setInterval(drawOverlay, 1000);
addEventListener('resize', drawOverlay);

function camMessage(text){ $('camMsg').hidden = !text; $('camMsgTxt').textContent = text || ''; }
async function startCam(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('shutter').disabled = true;
  if (!navigator.mediaDevices?.getUserMedia){ camMessage('Bu tarayıcı canlı kamerayı desteklemiyor. Soldaki düğmeyle fotoğraf seçebilirsin.'); $('retryCam').hidden = true; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 4032 }, height: { ideal: 3024 } } });
    video.srcObject = stream; await video.play().catch(() => {});
    camMessage(''); $('shutter').disabled = false;
  } catch(e){
    camMessage(e.name === 'NotAllowedError' ? 'Kamera izni verilmedi. Ayarlar → Safari → Kamera’dan izin ver, sonra tekrar dene.' : 'Kamera açılamadı.');
  }
}
video.addEventListener('loadedmetadata', drawOverlay);
video.addEventListener('resize', drawOverlay);
$('retryCam').onclick = startCam;
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
  else if ($('review').hidden) startCam();
});

/* ---------- Çekim ve inceleme ---------- */
let cur = null; // { src, date, gps, blob, name, from }
function renderShot(){
  const W = cur.src.naturalWidth || cur.src.width, H = cur.src.naturalHeight || cur.src.height;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(cur.src, 0, 0, W, H);
  drawStamp(x, 0, 0, W, H, cur.date, cur.gps);
  const d = cur.date;
  cur.name = `damga_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.jpg`;
  cur.blob = null;
  c.toBlob(b => { cur.blob = b; if (cur.url) URL.revokeObjectURL(cur.url); cur.url = URL.createObjectURL(b); $('shot').src = cur.url; }, 'image/jpeg', 0.92);
  const meta = [`<span>${W}×${H} px</span>`, `<span>Tarih: <b>${cur.from}</b></span>`];
  if (S.gps) meta.push(`<span>Konum: <b>${cur.gps ? (cur.gpsFrom || 'şu anki') : 'yok'}</b></span>`);
  $('meta').innerHTML = meta.join('');
}
function openReview(){
  $('shotDate').value = toLocal(cur.date); $('msg').textContent = ''; $('msg').className = '';
  renderShot(); $('review').hidden = false;
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
}
$('shutter').onclick = () => {
  if (!video.videoWidth) return;
  const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
  cur = { src: c, date: new Date(), gps: gps ? { ...gps } : null, from: 'çekim anı' };
  openReview();
};
$('shotDate').addEventListener('change', () => {
  const v = $('shotDate').value; if (!v) return;
  cur.date = new Date(v); cur.from = 'elle düzenlendi'; renderShot();
});
$('again').onclick = () => { $('review').hidden = true; cur = null; startCam(); };

$('save').onclick = async () => {
  if (!cur?.blob){ $('msg').textContent = 'Hazırlanıyor, bir saniye…'; return; }
  const file = new File([cur.blob], cur.name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file] }); $('msg').textContent = 'Paylaşım menüsünden kaydedildi.'; $('msg').className = 'ok'; return; }
    catch(e){ if (e.name === 'AbortError'){ $('msg').textContent = 'Vazgeçildi.'; $('msg').className = ''; return; } }
  }
  const a = document.createElement('a'); a.href = cur.url; a.download = cur.name; document.body.appendChild(a); a.click(); a.remove();
  $('msg').textContent = 'İndirildi. Olmadıysa fotoğrafa basılı tutup kaydet.'; $('msg').className = 'ok';
};

/* ---------- Galeriden seçme (EXIF tarih + konum) ---------- */
function readExif(buf){
  try {
    const v = new DataView(buf); if (v.getUint16(0) !== 0xFFD8) return {};
    let o = 2;
    while (o < v.byteLength - 10){
      const m = v.getUint16(o); if ((m & 0xFF00) !== 0xFF00) return {};
      const len = v.getUint16(o+2);
      if (m === 0xFFE1 && v.getUint32(o+4) === 0x45786966){
        const t = o+10, le = v.getUint16(t) === 0x4949;
        const g16 = p => v.getUint16(p, le), g32 = p => v.getUint32(p, le);
        const ifd = off => { const b = t+off, n = g16(b), e = {}; for (let i = 0; i < n; i++){ const p = b+2+i*12; e[g16(p)] = p+8; } return e; };
        const out = {}, i0 = ifd(g32(t+4));
        let dEnt = null;
        if (i0[0x8769]){ const ex = ifd(g32(i0[0x8769])); dEnt = ex[0x9003] || ex[0x9004] || null; }
        dEnt = dEnt || i0[0x0132];
        if (dEnt){ const sp = t + g32(dEnt); let s = ''; for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(sp+i));
          const r = s.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/); if (r) out.date = new Date(+r[1], r[2]-1, +r[3], +r[4], +r[5], +r[6]); }
        if (i0[0x8825]){
          const g = ifd(g32(i0[0x8825]));
          const rat = p => { const a = t + g32(p), r = k => g32(a+k*8) / (g32(a+k*8+4) || 1); return r(0) + r(1)/60 + r(2)/3600; };
          if (g[2] && g[4]){
            let lat = rat(g[2]), lon = rat(g[4]);
            if (g[1] && String.fromCharCode(v.getUint8(g[1])) === 'S') lat = -lat;
            if (g[3] && String.fromCharCode(v.getUint8(g[3])) === 'W') lon = -lon;
            if (lat || lon) out.gps = { lat, lon };
          }
        }
        return out;
      }
      o += 2 + len;
    }
  } catch(e) {}
  return {};
}
$('pick').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  let ex = {}; try { ex = readExif(await f.slice(0, 262144).arrayBuffer()); } catch(_) {}
  const img = new Image();
  img.onload = () => {
    cur = { src: img,
      date: ex.date || new Date(f.lastModified || Date.now()),
      from: ex.date ? 'fotoğraftan okundu' : 'dosya tarihi',
      gps: ex.gps || (gps ? { ...gps } : null),
      gpsFrom: ex.gps ? 'fotoğraftan okundu' : 'şu anki' };
    openReview();
  };
  img.onerror = () => { camMessage('Bu fotoğraf açılamadı. JPG veya PNG dene.'); };
  img.src = URL.createObjectURL(f);
});

/* ---------- Başlat ---------- */
if (S.gps) startGps();
startCam();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
